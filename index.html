<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuiAgent - AI Trading Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #050510;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: 
        radial-gradient(ellipse at 20% 20%, rgba(111, 188, 240, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(74, 159, 212, 0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 1;
    }
    .header {
      text-align: center;
      padding: 40px 0 30px;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #6fbcf0, #4a9fd4);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 0 30px rgba(111, 188, 240, 0.3);
    }
    .logo-text {
      font-size: 2.2em;
      font-weight: 700;
      background: linear-gradient(135deg, #6fbcf0, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tagline {
      color: #6b7280;
      font-size: 0.95em;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 20px 0 30px;
      flex-wrap: wrap;
    }
    .stat {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
    }
    .stat-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2ecc71;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
    .stat-label { color: #6b7280; }
    .stat-value { color: #e5e7eb; font-weight: 500; }
    .wallet-section {
      display: flex;
      justify-content: center;
      margin-bottom: 25px;
    }
    .wallet-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: rgba(111, 188, 240, 0.1);
      color: #6fbcf0;
      border: 1px solid rgba(111, 188, 240, 0.3);
      border-radius: 25px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
    }

      border-color: rgba(111
