<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SuiAgent - AI Trading Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      max-width: 900px;
      margin: 0 auto;
      background: #0a0a1a;
      color: white;
      padding: 30px 20px;
      min-height: 100vh;
    }
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { color: #6fbcf0; font-size: 2em; margin-bottom: 10px; }
    .header p { color: #888; font-size: 0.9em; }
    .wallet-section { display: flex; justify-content: center; margin-bottom: 25px; }
    .wallet-btn {
      padding: 12px 25px;
      background: #4a9fd4;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
    }
    .chat-container {
      background: #111128;
      border-radius: 15px;
      padding: 20px;
      border: 1px solid #1e1e3a;
    }
    textarea {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      background: #1a1a2e;
      color: white;
      border: 1px solid #2a2a4a;
      font-size: 15px;
      resize: none;
      outline: none;
    }
    .ask-btn {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      background: linear-gradient(135deg, #6fbcf0, #4a9fd4);
      color: #0a0a1a;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    #answer {
      margin-top: 20px;
      padding: 20px;
      background: #1a1a2e;
      border-radius: 10px;
      border-left: 4px solid #6fbcf0;
      min-height: 80px;
      line-height: 1.7;
      font-size: 15px;
      color: #ddd;
      white-space: pre-wrap;
    }
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }
    .suggestion-btn {
      padding: 8px 14px;
      background: #1a1a3a;
      color: #6fbcf0;
      border: 1px solid #2a2a5a;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-size: 13px;
      color: #888;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background: #2ecc71;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🤖 SuiAgent</h1>
    <p>AI-Powered Trading Assistant on Sui Blockchain</p>
  </div>

  <div class="wallet-section">
    <button class="wallet-btn" id="walletBtn">
      🔗 Connect Sui Wallet
    </button>
  </div>

  <div class="chat-container">
    <div class="status-bar">
      <span><span class="live-dot"></span>Live DeepBook Data</span>
      <span id="walletStatus">Wallet: Not connected</span>
    </div>

    <div class="suggestions">
      <button class="suggestion-btn" id="btn1">Trading Pools</button>
      <button class="suggestion-btn" id="btn2">Market Sentiment</button>
      <button class="suggestion-btn" id="btn3">How to Trade</button>
      <button class="suggestion-btn" id="btn4">Trading Risks</button>
    </div>

    <textarea id="question" rows="3" 
      placeholder="Ask me anything about Sui trading, DeepBook markets..."></textarea>
    <button class="ask-btn" id="askBtn">Ask Agent 🚀</button>
    <div id="answer">Your AI trading insights will appear here...</div>
  </div>

  <script>
    var walletAddress = null;

    window.onload = function() {
      document.getElementById('btn1').onclick = function() {
        document.getElementById('question').value = 'What trading pools are on DeepBook?';
        sendQuestion();
      };
      document.getElementById('btn2').onclick = function() {
        document.getElementById('question').value = 'What is the current SUI market sentiment?';
        sendQuestion();
      };
      document.getElementById('btn3').onclick = function() {
        document.getElementById('question').value = 'How do I trade on DeepBook?';
        sendQuestion();
      };
      document.getElementById('btn4').onclick = function() {
        document.getElementById('question').value = 'What are the risks of trading SUI?';
        sendQuestion();
      };
      document.getElementById('askBtn').onclick = function() {
        sendQuestion();
      };
      document.getElementById('walletBtn').onclick = function() {
        connectWallet();
      };
    };

    function connectWallet() {
      var answerDiv = document.getElementById('answer');
      if (window.suiWallet) {
        window.suiWallet.requestPermissions().then(function() {
          return window.suiWallet.getAccounts();
        }).then(function(accounts) {
          walletAddress = accounts[0];
          document.getElementById('walletBtn').innerText = '✅ ' + walletAddress.substring(0,6) + '...' + walletAddress.slice(-4);
          document.getElementById('walletStatus').innerText = 'Wallet: Connected';
          answerDiv.innerText = '✅ Wallet connected successfully!';
        }).catch(function(err) {
          answerDiv.innerText = 'Wallet error: ' + err.message;
        });
      } else {
        answerDiv.innerText = '⚠️ Sui Wallet not detected! Please make sure it is enabled in Chrome extensions.';
      }
    }

    function sendQuestion() {
      var question = document.getElementById('question').value;
      var answerDiv = document.getElementById('answer');

      if (!question.trim()) {
        answerDiv.innerText = 'Please type a question first!';
        return;
      }

      answerDiv.innerText = 'Thinking... 🤔';

      fetch('https://suiagent-production.up.railway.app/ask',
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: question, wallet: walletAddress })
      })
      .then(function(response) { return response.json(); })
      .then(function(data) {
        if (data.answer) {
          answerDiv.innerText = data.answer;
        } else if (data.error) {
          answerDiv.innerText = 'Error: ' + data.error;
        } else {
          answerDiv.innerText = 'No response received.';
        }
      })
      .catch(function(err) {
        answerDiv.innerText = 'Connection error: ' + err.message;
      });
    }
  </script>

</body>
</html>
